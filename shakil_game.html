<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><title>Shakil Snake Game</title><style>body{background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif}canvas{border:2px solid #00ffcc;background:#000;box-shadow:0 0 20px rgba(0,255,204,0.3)}h1{margin-bottom:10px;color:#00ffcc}</style></head>
<body><h1>শাকিলের স্নেক গেম</h1><canvas id="gameCanvas" width="400" height="400"></canvas><p>অ্যারো কি (Arrow Keys) দিয়ে সাপ কন্ট্রোল করুন!</p><script>const canvas=document.getElementById("gameCanvas");const ctx=canvas.getContext("2d");let box=20;let snake=[{x:9*box,y:10*box}];let food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box};let score=0;let d;document.addEventListener("keydown",direction);function direction(e){if(e.keyCode==37&&d!="RIGHT")d="LEFT";else if(e.keyCode==38&&d!="DOWN")d="UP";else if(e.keyCode==39&&d!="LEFT")d="RIGHT";else if(e.keyCode==40&&d!="UP")d="DOWN"}function draw(){ctx.fillStyle="#000";ctx.fillRect(0,0,400,400);for(let i=0;i<snake.length;i++){ctx.fillStyle=i==0?"#00ffcc":"#fff";ctx.fillRect(snake[i].x,snake[i].y,box,box)}ctx.fillStyle="red";ctx.fillRect(food.x,food.y,box,box);let snakeX=snake[0].x;let snakeY=snake[0].y;if(d=="LEFT")snakeX-=box;if(d=="UP")snakeY-=box;if(d=="RIGHT")snakeX+=box;if(d=="DOWN")snakeY+=box;if(snakeX==food.x&&snakeY==food.y){score++;food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box}}else{snake.pop()}let newHead={x:snakeX,y:snakeY};if(snakeX<0||snakeX>=400||snakeY<0||snakeY>=400||collision(newHead,snake)){clearInterval(game);alert("গেম ওভার! স্কোর: "+score);location.reload()}snake.unshift(newHead)}function collision(head,array){for(let i=0;i<array.length;i++){if(head.x==array[i].x&&head.y==array[i].y)return true}return false}let game=setInterval(draw,100);</script></body></html>
