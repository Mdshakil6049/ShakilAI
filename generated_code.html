<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Shakil Calculator</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #121214; font-family: Arial, sans-serif; }
        .calculator { background: #202024; padding: 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); width: 280px; }
        #display { width: 100%; height: 55px; background: #121214; color: #00ffcc; font-size: 26px; text-align: right; border: 1px solid #333; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-bottom: 15px; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; border: none; border-radius: 8px; background: #2e2e34; color: #fff; cursor: pointer; }
        button:hover { background: #3e3e46; }
        .operator { background: #ff9f43; }
        .clear { background: #ee5253; }
        .equal { background: #10ac84; grid-column: span 2; }
    </style>
</head>
<body>
<div class="calculator">
    <input type="text" id="display" readonly placeholder="0">
    <div class="btn-grid">
        <button class="clear" onclick="document.getElementById('display').value=''">C</button>
        <button class="operator" onclick="document.getElementById('display').value+='/'">/</button>
        <button class="operator" onclick="document.getElementById('display').value+='*'">*</button>
        <button class="operator" onclick="document.getElementById('display').value+='-'">-</button>
        <button onclick="document.getElementById('display').value+='7'">7</button>
        <button onclick="document.getElementById('display').value+='8'">8</button>
        <button onclick="document.getElementById('display').value+='9'">9</button>
        <button class="operator" onclick="document.getElementById('display').value+='+'">+</button>
        <button onclick="document.getElementById('display').value+='4'">4</button>
        <button onclick="document.getElementById('display').value+='5'">5</button>
        <button onclick="document.getElementById('display').value+='6'">6</button>
        <button onclick="document.getElementById('display').value+='.'">.</button>
        <button onclick="document.getElementById('display').value+='1'">1</button>
        <button onclick="document.getElementById('display').value+='2'">2</button>
        <button onclick="document.getElementById('display').value+='3'">3</button>
        <button onclick="document.getElementById('display').value+='0'">0</button>
        <button class="equal" onclick="try{document.getElementById('display').value=eval(document.getElementById('display').value)}catch{document.getElementById('display').value='Error'}">=</button>
    </div>
</div>
</body>
</html>
